<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Estúdio de vídeos</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  :root { --a: #d6ff3d; --a2: #9d7fe0; --base: #1a1030; --ink: #f4efff; --muted: rgba(244, 239, 255, .62); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07040c; font-family: 'Inter Tight', sans-serif; color: var(--ink); }
  #bg { position: absolute; inset: 0; background:
      radial-gradient(70% 90% at 72% 45%, color-mix(in srgb, var(--base) 85%, var(--a) 15%) 0%, transparent 70%),
      radial-gradient(60% 70% at 10% 100%, color-mix(in srgb, var(--a2) 22%, transparent) 0%, transparent 70%),
      linear-gradient(160deg, #0b0614 0%, var(--base) 55%, #07040c 100%); }
  #grid { position: absolute; inset: -20%; opacity: .16;
    background-image: linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
    background-size: 80px 80px; transform-origin: 50% 0; mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 75%); }
  canvas#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #ui { position: absolute; inset: 0; perspective: 1400px; }
  .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: .02em; }
  .abs { position: absolute; will-change: transform, opacity; }

  /* intro */
  #intro { left: 0; right: 0; top: 330px; text-align: center; transform-style: preserve-3d; }
  #introKicker { font-size: 26px; color: var(--a); text-transform: uppercase; margin-bottom: 18px; }
  #introTitle { font-family: 'Anton', sans-serif; font-size: 230px; line-height: .95; text-transform: uppercase; white-space: nowrap; transform-style: preserve-3d; }
  #introTitle span { display: inline-block; transform-origin: 50% 100%; }
  #introYear { font-size: 22px; color: var(--muted); margin-top: 26px; }

  /* cabeçalho fixo durante a demo */
  #head { left: 110px; top: 92px; }
  #headName { font-family: 'Anton', sans-serif; font-size: 92px; line-height: 1; text-transform: uppercase; color: var(--a); }
  #headKind { font-size: 20px; color: var(--muted); margin-top: 12px; text-transform: uppercase; }

  #tagline { left: 110px; top: 300px; width: 860px; font-size: 76px; font-weight: 700; line-height: 1.04; letter-spacing: -.02em; }
  #tagline .l { display: block; overflow: hidden; padding-bottom: 6px; }
  #tagline .l span { display: inline-block; }
  #tagline .l:last-child span { color: var(--a); }

  #callouts { left: 110px; top: 560px; width: 700px; display: grid; gap: 22px; }
  .co { display: flex; align-items: center; gap: 22px; padding: 22px 28px; border-radius: 22px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(8px);
    font-size: 30px; font-weight: 500; line-height: 1.2; transform-origin: 0 50%; }
  .co b { flex: none; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--a); color: #0a0510;
    font-family: 'JetBrains Mono', monospace; font-size: 20px; }
  .co.on { background: color-mix(in srgb, var(--a) 16%, rgba(255,255,255,.04)); border-color: color-mix(in srgb, var(--a) 60%, transparent); }

  #badge { font-size: 17px; color: var(--muted); padding: 9px 16px; border-radius: 99px; border: 1px dashed rgba(255,255,255,.3); text-transform: uppercase; }
  #badge i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--a); margin-right: 10px; vertical-align: 1px; }

  #stackWrap { left: 0; right: 0; top: 700px; text-align: center; }
  #stackTitle { font-size: 22px; color: var(--muted); text-transform: uppercase; margin-bottom: 26px; }
  #stack { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; padding: 0 160px; transform-style: preserve-3d; }
  #stack span { display: inline-block; padding: 18px 30px; border-radius: 99px; font-size: 30px; font-weight: 600; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); }
  #stack span:nth-child(3n+1) { border-color: var(--a); color: var(--a); }

  #outro { left: 0; right: 0; top: 250px; text-align: center; }
  #outroName { font-family: 'Anton', sans-serif; font-size: 200px; line-height: 1; text-transform: uppercase; color: var(--a); }
  #outroCtaL { font-size: 26px; color: var(--muted); text-transform: uppercase; margin-top: 46px; }
  #outroCta { display: inline-block; margin-top: 16px; font-size: 48px; font-weight: 600; padding: 20px 44px; border-radius: 99px; background: var(--a); color: #0a0510; }
  #outroBy { margin-top: 80px; display: flex; justify-content: center; align-items: center; gap: 22px; font-size: 26px; }
  #outroBy .sm { width: 64px; height: 64px; border-radius: 16px; background: #0a0510; border: 2px solid var(--a); display: grid; place-items: center; font-family: 'Anton'; font-size: 28px; color: var(--a); }
  #outroBy small { display: block; color: var(--muted); font-size: 20px; margin-top: 4px; }
  #flash { inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grid"></div>
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="ui">
    <div id="intro" class="abs"><div id="introKicker" class="mono"></div><div id="introTitle"></div><div id="introYear" class="mono"></div></div>
    <div id="head" class="abs"><div id="headName"></div><div id="headKind" class="mono"></div></div>
    <div id="tagline" class="abs"></div>
    <div id="callouts" class="abs"></div>
    <div id="badge" class="abs mono"><i></i><span></span></div>
    <div id="stackWrap" class="abs"><div id="stackTitle" class="mono">Feito com</div><div id="stack"></div></div>
    <div id="outro" class="abs">
      <div id="outroName"></div>
      <div id="outroCtaL" class="mono"></div>
      <div id="outroCta"></div>
      <div id="outroBy"><div class="sm">SM</div><div style="text-align:left">Stephany Marques<small class="mono">Full Stack Developer · stemarq.github.io</small></div></div>
    </div>
    <div id="flash" class="abs"></div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module" src="./studio.js"></script>
</body>
</html>
